<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>(function(){var t="light";try{var s=localStorage.getItem("younews-theme");if(s==="light"||s==="dark")t=s;}catch(e){}document.documentElement.classList.add(t);})();</script>
  <title>Checkout — You News</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="You News Paddle checkout">
  <link rel="icon" href="assets/you_news_mark.png" type="image/png">
  <link rel="stylesheet" href="styles.css?v=27">
  <script src="paddle-config.js?v=2"></script>
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <script>
    (function () {
      var c = window.YOUNEWS_PADDLE || {};
      if (!c.clientToken || !window.Paddle) return;
      try {
        if (c.sandbox) Paddle.Environment.set("sandbox");
        Paddle.Initialize({
          token: c.clientToken,
          checkout: {
            settings: {
              displayMode: "overlay",
              theme: document.documentElement.classList.contains("light") ? "light" : "dark"
            }
          }
        });
      } catch (e) {
        console.error(e);
      }
    })();
  </script>
  <script src="i18n.js?v=23" defer></script>
</head>
<body>
  <main class="wrap legal">
    <p class="kicker">You News</p>
    <h1 data-i18n="checkout_page_h">Ödeme</h1>
    <div class="card">
      <p data-i18n="checkout_page_lead">Paddle ödemesi bu sayfada açılır. Pencere gelmezse ana sayfadan yeniden deneyin.</p>
      <p><a class="btn" href="index.html#price" data-i18n="back">← Ana sayfa</a></p>
    </div>
  </main>
</body>
</html>
